services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production
    container_name: eventhub-frontend-prod
    networks:
      - eventhub-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: eventhub-backend-prod
    environment:
      - PORT=5000
    networks:
      - eventhub-network

  postgres:
    image: postgres:16-alpine
    container_name: eventhub-postgres-prod
    environment:
      POSTGRES_DB: eventhub
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    networks:
      - eventhub-network

  mongo:
    image: mongo:latest
    container_name: eventhub-mongo-prod
    volumes:
      - mongo-prod-data:/data/db
    networks:
      - eventhub-network

  redis:
    image: redis:alpine
    container_name: eventhub-redis-prod
    volumes:
      - redis-prod-data:/data
    networks:
      - eventhub-network

  nginx:
    image: nginx:alpine
    container_name: eventhub-nginx-prod
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - eventhub-network

volumes:
  postgres-prod-data:
  mongo-prod-data:
  redis-prod-data:

networks:
  eventhub-network:
